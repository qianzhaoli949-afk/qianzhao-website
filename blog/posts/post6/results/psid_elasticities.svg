<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" role="img" aria-labelledby="title desc">
<title id="title">IGEs using one year and three-wave income averages</title>
<desc id="desc">Five estimates compare parent and adult-child family income measures using the same matched PSID sample.</desc>
<rect width="100%" height="100%" fill="white"/>
<text x="26" y="34" font-family="Arial,sans-serif" font-size="21" font-weight="bold" fill="#17324c">Intergenerational family-income elasticity</text>
<line x1="390.0" y1="68" x2="390.0" y2="375" stroke="#e0e8ee"/>
<text x="390.0" y="397" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#526271">0.0</text>
<line x1="466.7" y1="68" x2="466.7" y2="375" stroke="#e0e8ee"/>
<text x="466.7" y="397" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#526271">0.1</text>
<line x1="543.3" y1="68" x2="543.3" y2="375" stroke="#e0e8ee"/>
<text x="543.3" y="397" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#526271">0.2</text>
<line x1="620.0" y1="68" x2="620.0" y2="375" stroke="#e0e8ee"/>
<text x="620.0" y="397" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#526271">0.3</text>
<line x1="696.7" y1="68" x2="696.7" y2="375" stroke="#e0e8ee"/>
<text x="696.7" y="397" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#526271">0.4</text>
<line x1="773.3" y1="68" x2="773.3" y2="375" stroke="#e0e8ee"/>
<text x="773.3" y="397" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#526271">0.5</text>
<line x1="850.0" y1="68" x2="850.0" y2="375" stroke="#e0e8ee"/>
<text x="850.0" y="397" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#526271">0.6</text>
<text x="365" y="105" text-anchor="end" font-family="Arial,sans-serif" font-size="15" fill="#17324c">2000 parent / 2018 child</text>
<line x1="390" y1="100" x2="622.4" y2="100" stroke="#b56c2e" stroke-width="7" stroke-linecap="round"/>
<circle cx="622.4" cy="100" r="7" fill="#b56c2e"/>
<text x="635.4" y="105" font-family="Arial,sans-serif" font-size="15" font-weight="bold" fill="#b56c2e">0.303</text>
<text x="365" y="169" text-anchor="end" font-family="Arial,sans-serif" font-size="15" fill="#17324c">2000 parent / 2022 child</text>
<line x1="390" y1="164" x2="705.2" y2="164" stroke="#b56c2e" stroke-width="7" stroke-linecap="round"/>
<circle cx="705.2" cy="164" r="7" fill="#b56c2e"/>
<text x="718.2" y="169" font-family="Arial,sans-serif" font-size="15" font-weight="bold" fill="#b56c2e">0.411</text>
<text x="365" y="233" text-anchor="end" font-family="Arial,sans-serif" font-size="15" fill="#17324c">Parent average / 2018 child</text>
<line x1="390" y1="228" x2="675.7" y2="228" stroke="#b56c2e" stroke-width="7" stroke-linecap="round"/>
<circle cx="675.7" cy="228" r="7" fill="#b56c2e"/>
<text x="688.7" y="233" font-family="Arial,sans-serif" font-size="15" font-weight="bold" fill="#b56c2e">0.373</text>
<text x="365" y="297" text-anchor="end" font-family="Arial,sans-serif" font-size="15" fill="#17324c">Parent average / 2022 child</text>
<line x1="390" y1="292" x2="769.8" y2="292" stroke="#b56c2e" stroke-width="7" stroke-linecap="round"/>
<circle cx="769.8" cy="292" r="7" fill="#b56c2e"/>
<text x="782.8" y="297" font-family="Arial,sans-serif" font-size="15" font-weight="bold" fill="#b56c2e">0.495</text>
<text x="365" y="361" text-anchor="end" font-family="Arial,sans-serif" font-size="15" fill="#17324c">Three-wave averages</text>
<line x1="390" y1="356" x2="710.6" y2="356" stroke="#187b88" stroke-width="7" stroke-linecap="round"/>
<circle cx="710.6" cy="356" r="7" fill="#187b88"/>
<text x="723.6" y="361" font-family="Arial,sans-serif" font-size="15" font-weight="bold" fill="#187b88">0.418</text>
<text x="26" y="430" font-family="Arial,sans-serif" font-size="13" fill="#526271">PSID matched sample: 1467 mother–child pairs; all amounts in 2022 dollars.</text>
</svg>